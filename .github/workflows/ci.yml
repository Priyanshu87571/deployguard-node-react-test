name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    name: Node API tests
    runs-on: ubuntu-latest
    env:
      FORCE_CI_FAILURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test

  frontend-checks:
    name: Lint, TypeScript, and Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
