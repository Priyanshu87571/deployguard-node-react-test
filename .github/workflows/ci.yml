
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    name: Node API tests
    runs-on: ubuntu-latest
    env:
      FORCE_CI_FAILURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm install
      - run: npm test

  frontend-checks:
    name: Lint, TypeScript, and Vite build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
